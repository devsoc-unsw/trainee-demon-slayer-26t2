# ACCESS DOCS ONLINE VIA: http://localhost:3000/api-docs (after running node server.js OR npm run dev)
openapi: 3.0.0
info:
  title: My API
  description: API documentation for my backend
  version: 1.0.0
servers:
  - url: http://localhost:3000
    description: Local development server

tags:
  - name: Auth
  - name: Calendar

paths:

  ############################## AUTH: ##############################
  /user/auth/signup:
    post:
      tags: [Auth]
      summary: Signs up a user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, firstName, lastName]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password }
                firstName: { type: string }
                lastName: { type: string }
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '409':
          description: Email already in use

  /user/auth/login:
    post:
      tags: [Auth]
      summary: Logs in an existing user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password }
      responses:
        '200':
          description: User logged in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '400':
          description: invalid email or password
        '401':
          description: email and password are required

  /user/auth/logout:
    post:
      tags: [Auth]
      summary: Logs out a logged in user
      responses:
        '200':
          description: User logged in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '400':
          description: invalid email or password
        '401':
          description: missing or invalid authorization header

  /user/auth/account:
    post:
      tags: [Auth]
      summary: Deletes an existing user
      
      responses:
        '200':
          description: User logged in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '400':
          description: invalid email or password
        '401':
          description: missing or invalid authorization header

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    AuthResponse:
      type: object
      properties:
        token: { type: string }
        user: { $ref: '#/components/schemas/User' }

    User:
      type: object
      properties:
        id: { type: string }
        firstName: { type: string }
        lastName: { type: string }
        email: { type: string, format: email }
        createdAt: { type: string, format: date-time }